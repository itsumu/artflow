[project]
name = "artflow"
version = "0.1.0"
description = "Local, auditable art-production workbench"
requires-python = ">=3.11"

[project.scripts]
artflow = "artflow.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
