[project]
name = "artflow"
version = "0.2.0"
description = "Local, auditable art-production workbench"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["art-pipeline", "game-development", "asset-pipeline", "local-tooling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/itsumu/artflow"
Documentation = "https://github.com/itsumu/artflow/tree/main/docs"
Issues = "https://github.com/itsumu/artflow/issues"
Source = "https://github.com/itsumu/artflow"

[project.scripts]
artflow = "artflow.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["artflow*"]

[tool.setuptools.package-data]
artflow = ["web/*", "examples/starter/*", "examples/starter/.gitignore", "examples/starter/inputs/*"]
