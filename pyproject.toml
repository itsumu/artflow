[project]
name = "artflow"
version = "0.2.0"
description = "Local, auditable art-production workbench"
requires-python = ">=3.11"
readme = "README.md"
classifiers = ["Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
artflow = "artflow.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["artflow*"]

[tool.setuptools.package-data]
artflow = ["web/*", "examples/starter/*", "examples/starter/.gitignore", "examples/starter/inputs/*"]
